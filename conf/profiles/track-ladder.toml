# track-ladder — the default. Re-read the whole failed track, sweeping the drive's
# admitted speed ladder, one rung per attempt.
#
# Bench: 19/20 across 8 targets (0.95), the most reliable arm measured, and the sole
# 3/3 at the hardest target (ABBA t19, n=47) where track-constant managed 1/3. That
# gap is what makes the ladder non-optional: at high n the speed diversity IS the
# recovery mechanism, not an optimisation on top of it.
#
# This is also what `_recover_failed_tracks` already does, so it is the shipped
# behaviour named rather than a change of behaviour.
name         = "track-ladder"
experimental = false

sub          = true
c2           = true

granularity  = "track"
ladder       = "full"
passes       = 3
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 300
