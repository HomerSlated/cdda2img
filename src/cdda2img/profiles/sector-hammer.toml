# sector-hammer — re-read each flagged sector on its own, one sector per read.
#
# WHAT DAMAGE IT IS FOR (kgr, 2026-11-25: "why does this profile exist")
#   Best for:  in principle, a flagged sector whose error is transient and reads
#              right when simply asked again, with nothing wrong around it.
#              MEASURED, nothing yet: 2/20 on the bench, 0/25 on the disc that
#              motivated it, 0/520 on Tracy tracks 8-9 (Nov 2026), and on 2026-11-25
#              30 failed reads of the two flagged sectors (112502, 113058) that
#              sector-runup then fixed in 8, and 150 failed reads of 113044.
#   Poor for:  damage outside the flagged sectors themselves, which it cannot
#              reach, and (as measured) most real damage.
#   Exists as a CONTROL: the least-variation re-read there is, anchoring the low
#   end so that the other profiles' gains mean something.
#
# EXPERIMENTAL, which DISABLES it (kgr, 2026-11-25): no rip runs it, named or in
# the automatic chain. It is the only profile that has never recovered anything.
# The decisive run: a clone at `passes = 10` x recovery_passes 3 made 150 one-sector
# reads of 113044 (Tracy track 8), 30 at each of 40, 32, 24, 8 and 4X, every one
# with a cache defeat, and matched none; whole-disc recovered the same sector at
# 8X and max-variation within 15 reads. Why it cannot work on this damage, and how
# it compares with the rest: docs/reference/RECOVERY.md, "sector-hammer: why it
# never works". To run it anyway, copy it to a user profile with
# `experimental = false`.
#
# The measured floor: on the bench (one speed, 32x) the minimum
# variation of every arm. 2/20 (0.10), 0/25 on the disc that motivated the whole
# bench, while plain whole-disc passes on the same disc came back clean ~27% of
# the time.
#
# This is the shape the pre-bench `_recover_rung` used, kept as the control that
# anchored the low end of the variation axis. In the rip it no longer holds one
# speed: `ladder = "full"` steps through the admitted ladder (kgr, 2026-11-21), so
# it is not the bench's zero point; `ladder = "single"` holds `recovery_speed` and
# restores it. It reads only the flagged sectors themselves: damage in a sector
# the capture did not flag is out of its reach.
#
# With several flagged sectors the reads take them in turn, and since 2026-11-24
# (kgr) the speed steps once per ROUND of them: every target is read at every
# rung, and the targets of a round share one speed, so a round at a speed that
# reads them all correctly repairs the track. Reaching every rung for n targets
# on an L-rung ladder takes n x L reads (two targets on five rungs: `passes` 10).
# Before then the speed stepped on every read while the target advanced too, so
# target j only met rungs j, j + n, ...: five targets on five rungs were each read
# at one speed, and two targets never shared a speed.
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name): it stands alone, so a
# track it does not recover is not handed to the speed ladder; every read asks
# AccuDisc for a cache defeat, which the bench did not.
#
# `passes = 1`: one sweep per attempt, every flagged sector at every admitted rung
# (targets x rungs reads), the least that tries every speed (kgr, 2026-11-24; it was
# 8 reads). Config or CLI `recovery_passes` repeats the sweep; the first
# AccurateRip match ends the reads. `budget_s` is seconds per read: a track may take
# budget_s x its planned reads, a guard against a stalled drive that should never
# bind.
name         = "sector-hammer"
experimental = true
best_for     = "a control only: has never recovered a sector (disabled)"

sub          = true
c2           = true

granularity  = "sector"
ladder       = "full"
passes       = 1
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 10
