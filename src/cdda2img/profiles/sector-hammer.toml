# sector-hammer — re-read each flagged sector on its own, one sector per read.
#
# EXPERIMENTAL, and the measured floor: on the bench (one speed, 32x) the minimum
# variation of every arm. 2/20 (0.10), 0/25 on the disc that motivated the whole
# bench, while plain whole-disc passes on the same disc came back clean ~27% of
# the time.
#
# This is the shape the pre-bench `_recover_rung` used, kept as the control that
# anchored the low end of the variation axis. In the rip it no longer holds one
# speed: `ladder = "full"` steps to the next admitted rung on every read (kgr,
# 2026-11-21), so it is not the bench's zero point; `ladder = "single"` holds
# `recovery_speed` and restores it. It reads only the flagged sectors themselves:
# damage in a sector the capture did not flag is out of its reach. With several
# flagged sectors the reads take them in turn while the speed steps, both by one
# per read, so with n targets on an L-rung ladder each target is only ever read at
# L/gcd(n, L) of the rungs, however many passes: five targets on a five-rung
# ladder get one speed each, two on a four-rung ladder two speeds each. The newest
# read of each sector replaces the last, so only lcm(n, L) of the L^n speed
# combinations ever stand together (two targets, five rungs: 10 of 25).
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name): it stands alone, so a
# track it does not recover is not handed to the speed ladder; every read asks
# AccuDisc for a cache defeat, which the bench did not; and `passes` is reads per
# track (the bench's --max-attempts, 8), bounded by budget_s per track.
name         = "sector-hammer"
experimental = true

sub          = true
c2           = true

granularity  = "sector"
ladder       = "full"
passes       = 8
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 120
