# sector-hammer — re-read the single flagged sector, same speed, over and over.
#
# EXPERIMENTAL, and the measured floor: minimum variation of every arm. 2/20 (0.10),
# 0/25 on the disc that motivated the whole bench, while plain whole-disc passes on
# the same disc came back clean ~27% of the time.
#
# This is the shape the pre-bench `_recover_rung` used. It is kept as the control
# that anchors the low end of the variation axis — deleting it would leave the
# ranking with no zero point.
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name): it stands alone, so a
# track it does not recover is not handed to the speed ladder; every read asks
# AccuDisc for a cache defeat, which the bench did not; and `passes` is reads per
# track (the bench's --max-attempts, 8), bounded by budget_s per track.
name         = "sector-hammer"
experimental = true

sub          = true
c2           = true

granularity  = "sector"
ladder       = "full"
passes       = 8
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 120
