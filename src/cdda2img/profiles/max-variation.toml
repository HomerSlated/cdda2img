# max-variation — random rung x random run-up x random order, around the flagged
# sectors.
#
# WHAT DAMAGE IT IS FOR (kgr, 2026-11-25: "why does this profile exist")
#   Best for:  a HANDFUL of flagged sectors (light, localised damage). The
#              fastest profile there on the bench, 5x quicker than track-ladder
#              on Tracy.
#   Poor for:  broad damage: 0/9 at high flagged counts. The automatic chain
#              does not run it above 5 flagged sectors.
#   Exists because the bench found that VARIATION (speed, run-up length and read
#   order, all at once) is what recovers sectors, not the size of the read; the
#   span-fixed control separated the two. It varies everything around each
#   flagged sector.
#
# Bench: 13/20 (0.65) overall, but that average hides the shape: fastest arm at low
# n (5x quicker than track-ladder on Tracy) and 0/9 at high n. Use it when the
# damage is a handful of sectors; it collapses when the defect is broad.
#
# The `span-fixed` control exists because of this arm — max-variation reads 145-664
# sectors while sector-runup reads 35, so span size and randomness were confounded.
# span-fixed isolates span at 0/16, which is what promotes variation itself from
# "incidental" to the active ingredient.
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name): it stands alone, so a
# track it does not recover is not handed to the speed ladder; every read asks
# AccuDisc for a cache defeat, which the bench did not.
#
# `passes = 1`: one sweep per attempt, as many reads as targets x rungs (kgr,
# 2026-11-24; it was 8 reads), drawn at random, so no pairing is promised. Config or
# CLI `recovery_passes` repeats the sweep; the first AccurateRip match ends the
# reads. `budget_s` is seconds per read: a track may take budget_s x its planned
# reads, a guard against a stalled drive that should never bind.
# The seed of its random choices is in PROV (recovery_seed), so its reads can
# be regenerated.
#
# Was EXPERIMENTAL until a hardware run of this code reproduced the bench (kgr,
# 2026-11-21). On AccuDisc 0.59, 2026-11-25, Tracy: track 9 at the 2nd read,
# track 8 at the 12th of 15 (with recovery_passes = 3; one sweep, 5 reads, would
# have missed). Mark removed (kgr); `experimental = true` now disables a profile.
name         = "max-variation"
experimental = false
best_for     = "a handful of flagged sectors; fails on broad damage"

sub          = true
c2           = true

granularity  = "sector"
ladder       = "full"
passes       = 1
variation    = "full"

ctdb         = "auto"
verify       = false
budget_s     = 15
