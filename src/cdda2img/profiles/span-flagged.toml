# span-flagged — re-read only the sectors the capture pass flagged, clustered into
# padded spans, and commit a track only when the assembled result matches
# AccurateRip. Runs ahead of the speed ladder, which still gets every track it
# does not recover. Design: docs/reference/span-recovery-plan.md.
#
# WHAT DAMAGE IT IS FOR (kgr, 2026-11-25: "why does this profile exist")
#   Best for:  localised damage, a few clusters of flagged sectors such as a
#              scratch, where re-reading just those spans and letting AccuDisc's
#              engine verify and rescue them locally assembles a clean track.
#              Measured once on hardware (AccuDisc 0.59, Tracy track 8, 2026-11-25):
#              matched on the first pass, one span read. The automatic chain tries
#              it first when a track has 1-5 flagged sectors.
#   Poor for:  damage the capture did not flag (it reads only around flagged
#              sectors).
#   Exists as the least drive work of any re-read: it touches only the sectors
#   in doubt, and hands their local checking (verify, C2 and Q evidence, slip
#   detection) to the engine, which owns local evidence under the 2026-11-25
#   re-read ownership ruling.
#
# First run on hardware 2026-11-25 (AccuDisc 0.59, all read-policy features on):
# one flagged sector left by the capture's own rescue, matched at the first pass.
# The plan's H1/H2 bench runs were cancelled on 2026-09-24 and that ruling was
# rescinded on 2026-11-21. Was EXPERIMENTAL until 2026-11-25 (kgr);
# `experimental = true` now disables a profile. One run is not a ranking: the
# engine's shift search was on and had nothing to find (AccuDisc 25ae).
#
# span_gap / span_pad are UNMEASURED. The captures the plan meant to tune them
# against were deleted under the scratch rule. pad = 4 matches the ±4 margin
# AccuDisc scored 41/44 on the one span measured; they refused ±8 precisely because
# it scored 44/44 on that single observation. gap = 8 = 2 × pad, so two flagged
# sites whose padding would touch are merged into one read.
#
# `passes = 1`: one sweep per attempt, one pass per admitted rung, each re-reading
# every span (kgr, 2026-11-24; it was 3 passes, fewer than the rungs). Config or
# CLI `recovery_passes` repeats the sweep; the first AccurateRip match ends the
# passes. `budget_s` is seconds per span read: a track may take budget_s x spans x
# passes, a guard against a stalled drive that should never bind.
#
# The engine's settings (verify 2, overlap 0, the cache defeat, a rescue ladder
# below each attempt's speed, rescue_by_rung, shift_search) are AccuDisc's read
# policy (SPAN_RESCUE) since 2026-11-25, not fields here.
name            = "span-flagged"
experimental    = false
best_for        = "local clusters of flagged sectors, such as a scratch"

sub             = true
c2              = true

granularity     = "span"
ladder          = "full"
passes          = 1
span_gap        = 8
span_pad        = 4
variation       = "none"

ctdb            = "auto"
budget_s        = 30
