# whole-disc — re-read the whole audio session ([0, its lead-out); never an
# Enhanced CD's data session) once per pass, and test every failed track
# against that one read. `ladder = "full"`: each pass reads at the next rung the
# drive admits, fastest first, cycling (kgr, 2026-11-21).
#
# WHAT DAMAGE IT IS FOR (kgr, 2026-11-25: "why does this profile exist")
#   Best for:  what the targeted profiles cannot reach: several failing tracks at
#              once, damage the capture did not flag, and errors that depend on
#              how the drive arrives at the area. A fresh full pass came back
#              clean ~27% of the time on the disc where sector-hammer scored 0/25.
#   Poor for:  cost. Every read is the whole audio session (about 20 minutes a
#              sweep on Tracy); bench 11/20.
#   Exists because it carries the most positional variation of any profile, and
#   it is the original evidence that variation, not targeting, drives recovery.
#   In the automatic chain it runs last, once, shared by every track still
#   failing.
#
# Bench: 11/20 (0.55). Expensive per attempt, but it carries the most positional
# variation of any single-speed arm — a fresh whole-disc pass came back clean ~27%
# of the time on the disc where sector-hammer scored 0/25. That contrast is the
# original evidence that variation, not targeting, drives recovery.
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name). Named with --profile it
# runs alone; in the automatic chain it is the last stage, shared by every track
# still failing. It asks for NO cache defeat (AccuDisc 2026-11-21j, kgr): its
# read covers the whole session, so there is nowhere outside it for a far read
# to go, and the disc's start cannot be cached after a pass that ended at the
# lead-out.
#
# `passes = 1`: one sweep per attempt, one whole-disc read per admitted rung (kgr,
# 2026-11-24; it was 8 reads). Config or CLI `recovery_passes` repeats the sweep;
# each read serves every failed track, and the reads stop once none is left.
# `budget_s` is seconds per whole-disc read (an 80-minute disc at 4x takes about
# 1200 s), a guard against a stalled drive that should never bind. On Tracy one
# sweep is about 20 minutes.
#
# Was EXPERIMENTAL until a hardware run of this code reproduced the bench (kgr,
# 2026-11-21). On AccuDisc 0.59, 2026-11-25, Tracy track 8 (113044 flagged): it
# matched at the 4th whole-disc read, at 8X, after 40, 32 and 24X missed. Mark
# removed (kgr); `experimental = true` now disables a profile.
name         = "whole-disc"
experimental = false
best_for     = "several failing tracks or unflagged damage; slow (whole disc)"

sub          = true
c2           = true

granularity  = "whole-disc"
ladder       = "full"
passes       = 1
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 1500
