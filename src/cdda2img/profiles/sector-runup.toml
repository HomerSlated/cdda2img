# sector-runup — re-read each flagged sector with a fixed run-up ahead of it.
#
# WHAT DAMAGE IT IS FOR (kgr, 2026-11-25: "why does this profile exist")
#   Best for:  a FEW flagged sectors, especially where single-sector re-reads keep
#              failing. Measured 2026-11-25, Tracy track 8 (capture at 4x, the
#              same two flagged sectors 112502 and 113058): it matched AccurateRip
#              after 8 reads, where sector-hammer had failed 30. Each read streams
#              the 32 sectors before a flagged sector and the 2 after, so it also
#              reaches unflagged damage that close.
#   Poor for:  broad damage (it reads only around flagged sectors). Bench: 2/20,
#              both on one easy target, 0/3 on every hard one.
#   Exists as the cheapest way to give the drive a running start at the defect.
#   On the bench a bare single-sector read was byte-exact 0.20 of the time at
#   114436@40x, against 0.60 with a 16-64 sector run-up. Why the run-up helps is
#   not measured, only that it does.
#
# Bench: 2/20 (0.10), and both wins were on one degenerate n=1 target; 0/3 on every
# hard target. Kept because it is the cheapest arm that still gives the drive a
# streaming approach to the defect. Was EXPERIMENTAL until 2026-11-25, when it
# fixed in 8 reads the two sectors sector-hammer missed in 30 (kgr);
# `experimental = true` now disables a profile.
#
# Each read covers the `run_up` (32) sectors before a flagged sector and the 2 after
# it, so it also repairs unflagged damage that close (sector-hammer cannot). It
# takes several targets in turn, and like sector-hammer, since 2026-11-24 (kgr) its
# speed steps once per round of them, so every target is read at every rung; until
# then it stepped on every read, and each of n targets met only L/gcd(n, L) of the
# L rungs.
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name): it stands alone, so a
# track it does not recover is not handed to the speed ladder; every read asks
# AccuDisc for a cache defeat, which the bench did not.
#
# `passes = 1`: one sweep per attempt, every flagged sector at every admitted rung
# (targets x rungs reads), the least that tries every speed (kgr, 2026-11-24; it was
# 8 reads). Config or CLI `recovery_passes` repeats the sweep; the first
# AccurateRip match ends the reads. `budget_s` is seconds per read: a track may take
# budget_s x its planned reads, a guard against a stalled drive that should never
# bind.
name         = "sector-runup"
experimental = false
best_for     = "a few flagged sectors that single-sector re-reads keep missing"

sub          = true
c2           = true

granularity  = "sector"
ladder       = "full"
passes       = 1
run_up       = 32
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 10
