# track-ladder — the default. Re-read the whole failed track, sweeping the drive's
# admitted speed ladder, one rung per read.
#
# WHAT DAMAGE IT IS FOR (kgr, 2026-11-25: "why does this profile exist")
#   Best for:  damage of any size, and the only profile proven on HEAVY damage:
#              3/3 at ABBA t19 (47 flagged sectors), 19/20 over the whole bench.
#              Choose it when you do not know what you face. The automatic chain
#              tries it first when a track has more than 5 flagged sectors.
#   Poor for:  speed on light damage. It re-reads the whole track at every rung,
#              so the targeted profiles usually finish sooner when they work.
#   Exists because read errors on a damaged disc are stable per SPEED (measured:
#   a majority vote across speeds rebuilt the reference disc 7/7), so changing
#   the speed is what turns an unreadable track into a readable one.
#
# Bench: 19/20 across 8 targets (0.95), the most reliable arm measured, and the sole
# 3/3 at the hardest target (ABBA t19, n=47) where track-constant managed 1/3. That
# gap is what makes the ladder non-optional: at high n the speed diversity IS the
# recovery mechanism, not an optimisation on top of it.
#
# This is also what `_recover_failed_tracks` already does, so it is the shipped
# behaviour named rather than a change of behaviour.
#
# `passes = 1`: one sweep per attempt, the track read once at every admitted rung,
# the least that tries every speed (kgr, 2026-11-24; it was 3 sweeps). Config or
# CLI `recovery_passes` repeats the sweep; the first AccurateRip match ends the
# reads. `budget_s` is not read at granularity = "track": the ladder always
# finishes its sweeps.
name         = "track-ladder"
experimental = false
best_for     = "any damage; the only profile proven on heavy damage"

sub          = true
c2           = true

granularity  = "track"
ladder       = "full"
passes       = 1
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 300
