# span-fixed — re-read a large FIXED span ending at the flagged sector, at one speed.
#
# EXPERIMENTAL, and a control rather than a candidate. It exists to separate two
# confounded explanations of max-variation's wins: it reads 145-664 sectors AND it
# randomises speed and run-up, while sector-runup reads 35 and randomises nothing.
# span-fixed holds the span large and the randomness at zero.
#
# Result: 1/16 (0.06) against max-variation's 2/3 on the same target with the same
# splice rule. Span size is therefore NOT the story — the variation is. Keeping the
# arm keeps that conclusion falsifiable on the next disc.
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name): it stands alone, so a
# track it does not recover is not handed to the speed ladder; every read asks
# AccuDisc for a cache defeat, which the bench did not.
#
# `passes = 1`: one sweep per attempt, one read per flagged sector, all at
# `recovery_speed` (kgr, 2026-11-24; it was 8 reads). Config or CLI
# `recovery_attempts` repeats the sweep; the first AccurateRip match ends the reads.
# `budget_s` is seconds per read: a track may take budget_s x its planned reads, a
# guard against a stalled drive that should never bind.
name         = "span-fixed"
experimental = true

sub          = true
c2           = true

granularity  = "sector"
ladder       = "single"
passes       = 1
span         = 512
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 15
