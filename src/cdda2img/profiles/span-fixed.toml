# span-fixed — re-read a large FIXED span ending at the flagged sector, at one speed.
#
# WHAT DAMAGE IT IS FOR (kgr, 2026-11-25: "why does this profile exist")
#   Best for:  a FEW flagged sectors, read with a long streaming approach (the
#              512 sectors before each) at one fast speed. Measured on AccuDisc
#              0.59, Tracy (2026-11-25): track 2's 15268 at the first read, and
#              track 8's 112766 + 113058 at the 6th read, all at 32X; sector-hammer
#              had failed 113058 in 30 reads.
#   Poor for:  broad damage: it reads once per flagged sector, so its reads grow
#              with the damage (the chain does not run it above 5 flagged).
#   Exists first as a CONTROL: it separates read size from variation in
#   max-variation's wins, by holding the read big and the variation at zero.
#
# Bench result (2026-07): 1/16 (0.06) against max-variation's 2/3 on the same
# target with the same splice rule, read then as "span size is NOT the story, the
# variation is". The 0.59 runs on Tracy CONTRADICT that: zero variation, fixed 32X,
# and it recovered track 8. One difference is known and unresolved: every rip read
# asks AccuDisc for a cache defeat first, and no bench read did. Which of the two
# results describes span-fixed is open; the arm stays runnable so either can be
# falsified.
#
# Was EXPERIMENTAL until 2026-11-25, when its 0.59 hardware results earned it a
# place in the automatic chain, second for light damage (kgr). `experimental = true`
# now disables a profile.
#
# In the rip since 2026-11-21 (cdda2img.strategy_reads, the bench's own read plan,
# picked from these fields rather than this file's name): it stands alone, so a
# track it does not recover is not handed to the speed ladder; every read asks
# AccuDisc for a cache defeat, which the bench did not.
#
# `passes = 1`: one sweep per attempt, one read per flagged sector, all at
# `recovery_speed` (kgr, 2026-11-24; it was 8 reads). Config or CLI
# `recovery_passes` repeats the sweep; the first AccurateRip match ends the reads.
# `budget_s` is seconds per read: a track may take budget_s x its planned reads, a
# guard against a stalled drive that should never bind.
name         = "span-fixed"
experimental = false
best_for     = "a few flagged sectors, each read after a 512-sector run-up"

sub          = true
c2           = true

granularity  = "sector"
ladder       = "single"
passes       = 1
span         = 512
variation    = "none"

ctdb         = "auto"
verify       = false
budget_s     = 15
