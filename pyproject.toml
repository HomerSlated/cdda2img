[project]
name = "cdda2img"
version = "0.1.8"
description = "Creates archive images of Red Book standard CD-DA Audio CDs"
authors = [{ name = "Homer", email = "github@hazensparkle.co.uk" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "av>=16.0.1",
    "discogs-client>=2.3.0",
    "mutagen>=1.46.0",
    "musicbrainzngs>=0.7.1",
    "numpy>=1.24",
    "ortools>=9.15.6755",
    "pyacoustid>=1.3.1",
    "pyebur128>=0.1.1",
    "textual>=8.2.4",
    "tomli>=2.0.0 ; python_version < '3.11'",
    "wayback>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/HomerSlated/cdda2img"
Repository = "https://github.com/HomerSlated/cdda2img"
Documentation = "https://github.com/HomerSlated/cdda2img"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",

    "ty>=0.0.1a16",

    "ruff>=0.11.5",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdda2img"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.14"

[tool.ty.src]
# scratch/ holds throwaway prototypes — not production code, not type-checked.
exclude = ["scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # discogs_client 2.3.0 has an invalid escape in fetchers.py; fixed upstream eventually
    "ignore::SyntaxWarning:discogs_client.*",
]

[tool.ruff]
target-version = "py39"
line-length = 88
fix = true
# scratch/ holds throwaway prototypes — not production code, not linted.
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # LINT-009: assert is the canonical pytest idiom; -O is never used in test runs

[tool.ruff.format]
preview = true
