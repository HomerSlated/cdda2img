[project]
name = "cdda2img"
version = "0.2.1"
description = "Creates archive images of Red Book standard CD-DA Audio CDs"
authors = [{ name = "Homer", email = "github@hazensparkle.co.uk" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "av>=16.0.1",
    "blake3>=1.0.0",
    "discogs-client>=2.3.0",
    "mutagen>=1.46.0",
    "musicbrainzngs>=0.7.1",
    "numpy>=1.24",
    "ortools>=9.15.6755",
    "pyacoustid>=1.3.1",
    "pyebur128>=0.1.1",
    "questionary>=2.0.0",
    "rapidfuzz>=3.0.0",
    "textual>=8.2.4",
    "tomli>=2.0.0 ; python_version < '3.11'",
    "wayback>=0.5.0",
    "unidecode>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/HomerSlated/cdda2img"
Repository = "https://github.com/HomerSlated/cdda2img"
Documentation = "https://github.com/HomerSlated/cdda2img"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "hypothesis>=6.0.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",

    "ty>=0.0.1a16",

    # Runtime dependency of AccuDisc's Python binding, not of cdda2img — an
    # API-mode cffi extension needs _cffi_backend to import, so a module that
    # built cleanly still dies at `from ._accudisc import ffi, lib` without it.
    # Carried here only because their package is not yet installable (their
    # build_accudisc.py sets an RPATH into their build tree; "install properly"
    # is an open TODO there). When that lands, cffi arrives as its dependency
    # and this line goes. Declared rather than hand-installed because `uv sync`
    # prunes anything absent from the lockfile — `make check` uninstalled it.
    "cffi>=1.16",

    "ruff>=0.11.5",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdda2img"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.14"
# tools/ holds standalone scripts that are not part of the installed package;
# they import each other (and are imported by their tests) via a sys.path
# insert, which ty cannot see. Listing the directory lets those resolve.
extra-paths = ["tools"]

[tool.ty.src]
# scratch/ holds throwaway prototypes — not production code, not type-checked.
exclude = ["scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Don't accumulate GBs of PCM temp dirs across runs: keep only the most recent session,
# and within it only failed tests' tmp_path dirs (passing tests clean up immediately).
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
filterwarnings = [
    # discogs_client 2.3.0 has an invalid escape in fetchers.py; fixed upstream eventually
    "ignore::SyntaxWarning:discogs_client.*",
]

[tool.ruff]
target-version = "py39"
line-length = 88
fix = true
# scratch/ holds throwaway prototypes — not production code, not linted.
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # LINT-009: assert is the canonical pytest idiom; -O is never used in test runs
"tests/test_disc_scan.py" = ["S101", "E402"]  # imports tools/disc_scan.py via a sys.path insert

[tool.ruff.format]
preview = true
